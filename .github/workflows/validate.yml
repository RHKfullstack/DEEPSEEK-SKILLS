name: validate

# First-party actions only. If you want immutable CI, pin each `uses:` to a full commit SHA; a
# mutable tag can be repointed by the action's maintainer. Restored after a bad merge glued two
# `run:` lines into one and left an empty `- name:` step, which made this file invalid YAML - so
# the validator never ran and a wrong skill count could reach main unnoticed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the YAML parser the validator uses
        run: npm install --no-save yaml@2
      - name: Validate the pack
        run: node scripts/validate-skills.mjs
      - name: Reject a duplicate or overlapping skill
        run: node scripts/check-duplicates.mjs
